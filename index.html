<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Prompt Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <h1>Prompt Library</h1>
        <p class="subtitle">Save and manage prompts locally</p>
      </div>
    </header>

    <main class="container">
      <section class="form-section">
        <form id="prompt-form" class="prompt-form">
          <label for="title">Title</label>
          <input
            id="title"
            name="title"
            type="text"
            placeholder="Prompt title"
            required
          />

          <label for="content">Prompt</label>
          <textarea
            id="content"
            name="content"
            rows="6"
            placeholder="Write your prompt here..."
            required
          ></textarea>

          <div class="form-actions">
            <button type="submit" id="save-btn" class="btn primary">
              Save prompt
            </button>
          </div>
        </form>
      </section>

      <section class="cards-section">
        <h2 class="cards-heading">Saved Prompts</h2>
        <div id="cards" class="cards-grid" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
