<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Prompt Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <h1>Prompt Library</h1>
        <p class="subtitle">Save and manage prompts locally</p>
      </div>
    </header>

    <!-- removed top controls-bar; theme switch moved next to the sort select below -->

    <main class="container">
      <section class="form-section">
        <form id="prompt-form" class="prompt-form">
          <label for="title">Title</label>
          <input
            id="title"
            name="title"
            type="text"
            placeholder="Prompt title"
            required
          />

          <label for="model">Model</label>
          <input
            id="model"
            name="model"
            type="text"
            placeholder="Model name (e.g., gpt-4)"
            maxlength="100"
            required
          />

          <label for="content">Prompt</label>
          <textarea
            id="content"
            name="content"
            rows="6"
            placeholder="Write your prompt here..."
            required
          ></textarea>

          <div class="form-actions">
            <button type="submit" id="save-btn" class="btn primary">
              Save prompt
            </button>
          </div>
        </form>
      </section>

      <section class="cards-section">
        <h2 class="cards-heading">Saved Prompts</h2>
        <div class="cards-controls">
          <div class="cards-controls-left">
            <label for="sort-select">Sort:</label>
            <select id="sort-select">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="rating-desc">Highest rating</option>
              <option value="rating-asc">Lowest rating</option>
            </select>
          </div>
          <div class="cards-controls-right">
            <label for="theme-toggle" class="switch-label">Dark mode</label>
            <label class="switch" title="Toggle dark mode">
              <input
                type="checkbox"
                id="theme-toggle"
                aria-label="Toggle dark mode"
              />
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <div id="cards" class="cards-grid" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
